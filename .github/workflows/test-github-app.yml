name: Test GitHub App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-github-app:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Create test branch and commit
        run: |
          BRANCH="test/github-app-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$BRANCH"

          cat > GITHUB_APP_TEST.md <<EOF
          # GitHub App Test

          This file was created automatically by my-ai-dev-bot.

          Workflow run: ${{ github.run_id }}
          EOF

          git add GITHUB_APP_TEST.md
          git commit -m "test: verify GitHub App write access"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Test: GitHub App automation" \
            --body "This pull request was created automatically by my-ai-dev-bot to verify GitHub App authentication, repository write access and pull request permissions."
